name: Change risk label smoke test
on:
  push:
    branches: [ivan-hu/risk-label-live-validation]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: TheIvanHu/databricks-ai-bridge
      PR_NUMBER: "7"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run risk and existing regression tests
        run: |
          python -m unittest discover .github/scripts/tests -v
          python .github/agentbricks-reviewer/test_prompt.py -v
      - name: Exercise actual risk-label and stale-clear workflow steps
        run: |
          python - <<'PY'
          import importlib.util, json, os, subprocess, textwrap
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('fixtures', '.github/scripts/tests/test_agentbricks_auto_approve.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          workflow = Path('.github/workflows/agentbricks-reviewer.yml').read_text()
          def script(start, end):
              text = workflow.split('      - name: ' + start + '\n', 1)[1]
              text = text.split('      - name: ' + end + '\n', 1)[0]
              return textwrap.dedent(text.split('        run: |\n', 1)[1]).rstrip()
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          repo, number = os.environ['REPO'], os.environ['PR_NUMBER']
          head = api(f'repos/{repo}/pulls/{number}')['head']['sha']
          env = dict(os.environ, HEAD_SHA=head)
          label_script = script('Label reviewed change risk', 'Auto-approve if low risk')
          clear_script = script('Clear risk labels for unreviewed commits', 'Dismiss approvals of earlier commits')
          cases = [
              ('README.md', 'low', module.review()),
              ('integrations/agentbricks/src/cli/app.py', 'medium', module.review()),
              ('REVIEW.md', 'high', module.review()),
              ('README.md', 'medium', module.review(change_risk='MODERATE')),
              ('README.md', 'high', module.review(change_risk='HIGH')),
              ('README.md', 'unrated', module.review(change_risk='Unrated')),
              ('README.md', 'low', module.review(score=90)),
              ('README.md', 'low', module.review(blocking='A verified bug.')),
              ('README.md', 'low', module.review(reviewers='1/2')),
          ]
          comments = []
          try:
              for path, expected, assessment in cases:
                  review_path, diff_path = Path('/tmp/smoke-review.txt'), Path('/tmp/smoke-diff.txt')
                  review_path.write_text(assessment)
                  diff_path.write_text(module.diff(path))
                  decision = json.loads(subprocess.check_output([
                      'python', '.github/scripts/agentbricks_auto_approve.py',
                      '--review', str(review_path), '--diff', str(diff_path),
                      '--safety-section', '/tmp/smoke-safety.md',
                  ], text=True))
                  assert decision['risk']['level'] == expected, decision
                  assert decision['approve'] == (expected == 'low' and decision['review_passed']), decision
                  section = Path('/tmp/smoke-safety.md').read_text()
                  assert '### Safety assessment' in section and 'Review score' in section, section
                  assert f'`risk:{expected}`' in section, section
                  assert section.count('/100') == 1 and 'Change safety' not in section, section
                  body = (
                      'TEST ONLY: synthetic safety assessment for isolated label validation.\n'
                      f'<!-- agentbricks-reviewer-risk-sha: {head} -->\n'
                      f'<!-- agentbricks-reviewer-risk-label: risk:{expected} -->\n'
                      f'<!-- agentbricks-reviewer-ai-approved: {str(decision["review_passed"]).lower()} -->\n'
                      + section
                  )
                  response = subprocess.check_output([
                      'gh', 'api', f'repos/{repo}/issues/{number}/comments',
                      '--input', '-',
                  ], input=json.dumps({'body': body}), text=True)
                  comment = json.loads(response)
                  comments.append(comment['id'])
                  assert comment['user']['login'] == 'github-actions[bot]', comment
                  subprocess.run(['bash', '-c', label_script], check=True, env=env)
                  labels = {label['name'] for label in api(f'repos/{repo}/issues/{number}/labels') if label['name'].startswith('risk:') or label['name'] == 'ai-approved'}
                  wanted = {f'risk:{expected}'} | ({'ai-approved'} if decision['review_passed'] else set())
                  assert labels == wanted, (labels, wanted)
                  print(f'PASS: {expected} labels={sorted(labels)}; review_passed={decision["review_passed"]}; approve={decision["approve"]}')
          finally:
              for identifier in comments:
                  subprocess.run(['gh', 'api', '--method', 'DELETE', f'repos/{repo}/issues/comments/{identifier}'], check=True)
              subprocess.run(['bash', '-c', clear_script], check=True, env=env)
          labels = [label['name'] for label in api(f'repos/{repo}/issues/{number}/labels') if label['name'].startswith('risk:') or label['name'] == 'ai-approved']
          assert not labels, labels
          print('PASS: unreviewed-head step clears stale risk labels')
          PY
      - name: Record scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Passed regression tests and live low / moderate / high / unrated risk and ai-approved label replacement on fork PR #7, then stale-label clearing. Assessments were synthetic fixtures; no model was called and no PR was approved or merged.
          SUMMARY
