name: Review plumbing smoke test
on:
  push:
    branches: [ivan-hu/review-live-validation]
permissions:
  contents: read
  pull-requests: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: TheIvanHu/databricks-ai-bridge
      PR_NUMBER: "7"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run both regression suites
        run: |
          python -m unittest discover .github/scripts/tests -v
          python .github/agentbricks-reviewer/test_prompt.py -v
      - name: Collect real PR paths with the fixed workflow step
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ""
          OMNIGENT_DIR: /tmp/not-used
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          workflow = Path('.github/workflows/agentbricks-reviewer.yml').read_text()
          step = workflow.split('      - name: Collect PR context and build prompt\n', 1)[1]
          script = step.split('        run: |\n', 1)[1].split('          grep -E', 1)[0]
          subprocess.run(['bash', '-c', textwrap.dedent(script)], check=True)
          PY
      - name: Check root and scoped criteria for the real changed paths
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          paths = json.loads(Path('/tmp/pr_changed_paths.json').read_text())
          assert paths == ['integrations/agentbricks/review-smoke-test.md'], paths
          spec = importlib.util.spec_from_file_location('prompt', '.github/agentbricks-reviewer/test_prompt.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          case = module.PromptTest()
          case.setUp()
          prompt = case.build_prompt(paths)
          assert '<review_rules source="REVIEW.md">' in prompt
          assert '<review_rules source="integrations/agentbricks/REVIEW.md">' in prompt
          assert prompt.count('<review_rules source=') == 2
          print('Live PR path discovery and exact root/scoped rule injection passed.')
          PY
      - name: Exercise the real bot counter and fourth-attempt stop
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            python .github/scripts/agentbricks_push_review.py \
              --repo "$REPO" --pr "$PR_NUMBER" --limit 3 --run-url "$RUN_URL" > /tmp/budget-result.txt
            cat /tmp/budget-result.txt
            if [ "$attempt" -le 3 ]; then
              grep -qx 'skip=false' /tmp/budget-result.txt
            else
              grep -qx 'skip=true' /tmp/budget-result.txt
            fi
          done
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body'
      - name: Record result
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Passed: 49 regression tests; fixed shallow Git collection against fork PR #7; exact root and AgentBricks criteria injection; three real bot-counter reservations; fourth automatic attempt skipped.

          This tests workflow plumbing. It does not call a model, approve, or merge a PR.
          SUMMARY
